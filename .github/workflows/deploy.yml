name: Publish Aboden Games studio
on:
  push:
    branches: [main]
    paths-ignore: ['build-info.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-built-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'aboden-games1/aboden-games1.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate approvals, preserve games and policies, build
        run: npm run build
      - run: python3 scripts/verify-build.py
      - name: Prepare Pages without deleting existing files
        run: node scripts/sync-pages.mjs
      - name: Commit generated site
        run: |
          # A newer merge on main has its own run (queued behind this one); let it publish instead of racing it.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past $GITHUB_SHA; the newer run publishes the site."
            echo "SUPERSEDED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified Aboden Games studio [skip ci]'
            git push origin HEAD:main
          fi
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Request Pages publication
        if: env.SUPERSEDED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify published revision and preserved privacy policy
        if: env.SUPERSEDED != '1'
        run: |
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 10 --max-time 20 -fsS "https://abodengames.com/build-info.json?revision=${GITHUB_SHA}" -o /tmp/live-build.json && jq -e --arg sha "$GITHUB_SHA" '.source == $sha' /tmp/live-build.json >/dev/null; then
              python3 scripts/verify-published.py
              exit 0
            fi
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$PUBLISHED_HEAD" ]; then
              echo "::notice::A newer commit reached main while waiting; its run verifies the live site."
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Tell search engines what changed (IndexNow — Bing, Yandex, Seznam, Naver)
        if: env.SUPERSEDED != '1'
        continue-on-error: true
        env:
          INDEXNOW_KEY: df1dae49e31b378c3f151625ceca736b
        run: |
          grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' > /tmp/urls.txt
          jq -n --arg key "$INDEXNOW_KEY" --rawfile urls /tmp/urls.txt \
            '{host:"abodengames.com",key:$key,keyLocation:("https://abodengames.com/"+$key+".txt"),urlList:($urls|split("\n")|map(select(length>0)))}' > /tmp/indexnow.json
          curl --connect-timeout 10 --max-time 30 -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' \
            -H 'Content-Type: application/json; charset=utf-8' --data @/tmp/indexnow.json https://api.indexnow.org/indexnow
