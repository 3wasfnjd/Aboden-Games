name: Verify studio and preserved files
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python3 scripts/verify-build.py
      - uses: actions/upload-artifact@v4
        with:
          name: studio-preview
          path: dist
          retention-days: 14
